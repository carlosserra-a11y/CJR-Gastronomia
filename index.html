<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="js/site/boot.js"></script>
  <script type="module" src="js/site/main.js"></script>

<body>

    <nav class="nav" aria-label="Principal">

        <a href="#/"><small>01</small>Início</a>

        <a href="#/como-funciona"><small>04</small>Como funciona</a>

    <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"></div>

  <noscript><div class="noscript">Para ver o cardápio e montar sua experiência, ative o JavaScript do navegador.</div></noscript>
