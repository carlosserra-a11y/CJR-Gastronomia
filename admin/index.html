<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel · CJR Gastronomia</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <!-- Login / primeiro acesso -->
  <main class="auth" id="auth" hidden>
    <div class="auth-card">
      <div class="auth-brand"><span>CJR</span><small>Gastronomia</small></div>
      <h1 id="authTitle">Painel da equipe</h1>
      <p id="authSub">Entre com sua conta para editar o cardápio.</p>
      <form id="authForm" novalidate></form>
      <a class="back-site" href="../">← Voltar ao site</a>
    </div>
  </main>

  <!-- Aplicação -->
  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <a class="side-brand" href="#inicio"><span>CJR</span><small>Painel</small></a>
      <nav class="side-nav" aria-label="Seções do painel">
        <a href="#inicio" data-route="inicio">Visão geral</a>
        <a href="#cardapio" data-route="cardapio">Cardápio</a>
        <a href="#textos" data-route="textos">Textos do site</a>
        <a href="#contato" data-route="contato">Contato e configurações</a>
        <a href="#historico" data-route="historico">Histórico</a>
        <a href="#conta" data-route="conta">Conta e equipe</a>
      </nav>
      <div class="side-foot">
        <a class="btn btn-line" href="../" target="_blank" rel="noopener">Ver site ↗</a>
        <div class="who"><span id="whoName">—</span><button type="button" class="link-btn" id="logoutBtn">Sair</button></div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn side-toggle" id="sideToggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
        <h1 id="viewTitle">Visão geral</h1>
        <span class="version-pill" id="versionPill"></span>
      </header>
      <section class="view" id="view" tabindex="-1"></section>
    </div>
  </div>

  <!-- Barra de alterações não salvas -->
  <div class="savebar" id="savebar" hidden role="region" aria-label="Alterações não salvas">
    <span class="savebar-dot" aria-hidden="true"></span>
    <p id="savebarText">Você tem alterações não salvas.</p>
    <button type="button" class="btn btn-ghost" id="discardBtn">Descartar</button>
    <button type="button" class="btn btn-primary" id="saveBtn">Salvar e publicar</button>
  </div>

  <dialog class="modal" id="modal" aria-labelledby="modalTitle"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="../js/admin/main.js"></script>
</body>
</html>
